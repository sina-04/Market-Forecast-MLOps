[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketforecast"
version = "0.1.0"
description = "Reproducible retrospective TSETMC closing-price research"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2", "requests>=2.32,<3", "jdatetime>=5,<6", "matplotlib>=3.8,<4", "joblib>=1.4,<2"]

[project.optional-dependencies]
train = ["tensorflow>=2.18,<2.21", "h5py>=3.11,<4"]
dev = ["pytest>=8,<10", "nbformat>=5.10,<6"]

[project.scripts]
marketforecast = "marketforecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

