name: Test pipeline
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q
  production-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python deploy/setup.py
      - run: docker build --target test -t marketforecast-test:ci .
      - run: docker run --rm -e MARKETFORECAST_TRAIN_TEST=1 marketforecast-test:ci pytest -q
      - run: docker build --target production -t marketforecast-service:local .
      - run: docker compose up -d --no-build --wait mlflow
      - run: docker compose run --rm register
      - run: docker compose up -d --no-build --wait api prometheus grafana
      - run: docker compose exec -T prometheus promtool check rules /etc/prometheus/alerts.yml
      - run: docker compose exec -T -w /etc/prometheus prometheus promtool test rules alerts.test.yml
      - run: python tools/production_acceptance.py
      - run: python tools/production_operations_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-acceptance
          path: artifacts/production/
      - run: docker compose down
        if: always()
